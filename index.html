<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#e8eef6">
<title>商圈精耕系統｜日勝房屋</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --pri:#4f78a8;--pri2:#36577f;--priL:rgba(79,120,168,.12);--priM:rgba(79,120,168,.22);
  --acc:#e6c27a;--accD:#a9813a;--accL:rgba(230,194,122,.22);
  --sage:#6faa8b;--apri:#e0a06e;--rose:#d47f79;
  --txt:#2d3b4e;--mut:#7d8a9c;--line:rgba(120,140,170,.18);
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.74);--glass3:rgba(255,255,255,.86);
  --gb:rgba(255,255,255,.65);--blur:blur(18px) saturate(160%);
  --sh:0 10px 34px rgba(46,70,105,.14),0 2px 6px rgba(46,70,105,.06);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color:var(--txt);background:linear-gradient(135deg,#e8eef6 0%,#f1eee7 100%);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s,transform .12s}
button:active{transform:scale(.97)}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);box-shadow:var(--sh)}
/* ---------- top bar ---------- */
#top{position:fixed;top:12px;left:12px;right:12px;height:58px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);box-shadow:var(--sh);color:var(--txt);display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;z-index:1100}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#f0d495,#e2b865);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px;box-shadow:0 4px 12px rgba(214,170,90,.35);text-shadow:0 1px 2px rgba(150,110,40,.35)}
.brand b{font-size:16px;font-weight:900;letter-spacing:.5px;display:block;line-height:1.15;color:var(--pri2)}
.brand small{display:block;font-size:11px;color:var(--mut);line-height:1.25}
#searchWrap{flex:1;max-width:440px;position:relative;margin-left:6px}
#q{width:100%;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.6);padding:0 16px;outline:none;box-shadow:inset 0 1px 2px rgba(46,70,105,.06)}
#q:focus{background:rgba(255,255,255,.88);border-color:var(--priM);box-shadow:0 0 0 4px var(--priL)}
#qres{position:absolute;top:48px;left:0;right:0;background:var(--glass3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);color:var(--txt);border-radius:16px;box-shadow:var(--sh);max-height:320px;overflow:auto;display:none}
#qres div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
#qres div:hover{background:var(--priL)}
#qres .h{font-size:12px;color:var(--mut);cursor:default;background:rgba(255,255,255,.4)}
.sp{flex:1}
.tbtn{height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.5);color:var(--pri2);padding:0 14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.85)}
.tbtn.gold{background:linear-gradient(135deg,#f2d89d,#e6c27a);color:#5e4613;border-color:rgba(255,255,255,.6);box-shadow:0 4px 12px rgba(214,170,90,.28)}
.tbtn.gold:hover{filter:brightness(1.04)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.cdot.pulse{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
.menu{position:relative}
.drop{position:absolute;right:0;top:50px;background:var(--glass3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);color:var(--txt);border-radius:16px;box-shadow:var(--sh);min-width:220px;padding:6px;display:none;z-index:1200}
.drop.on{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:14px}
.drop button:hover{background:var(--priL)}
.drop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.drop .danger{color:var(--rose)}
/* ---------- map + panel ---------- */
#map{position:fixed;inset:0;background:#e3e8ee}
.leaflet-tile-pane{filter:saturate(.72) brightness(1.04) contrast(.94) sepia(.06)}
.leaflet-control-zoom{border:1px solid var(--gb)!important;border-radius:14px!important;overflow:hidden;box-shadow:var(--sh)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.leaflet-control-zoom a{background:var(--glass2)!important;color:var(--pri2)!important;border-color:var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bottom.leaflet-left{margin:0 0 10px 4px}
.leaflet-control-attribution{background:rgba(255,255,255,.55)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:10px 0 0 0;color:var(--mut)!important}
#panel{position:fixed;top:82px;right:12px;width:384px;bottom:12px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);box-shadow:var(--sh);display:flex;flex-direction:column;z-index:1000;overflow:hidden}
body.panel-off #panel{display:none}
.ptabs{display:flex;gap:4px;padding:8px;flex:none;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:700;color:var(--mut);border-radius:12px;font-size:13.5px}
.ptabs button:hover{background:rgba(255,255,255,.4)}
.ptabs button.on{color:var(--pri2);background:rgba(255,255,255,.78);box-shadow:0 2px 8px rgba(46,70,105,.08)}
.pbody{flex:1;overflow:auto;padding:12px}
.grab{display:none}
@media(max-width:860px){
  #top{top:8px;left:8px;right:8px;height:54px;border-radius:18px}
  #panel{top:auto;left:8px;right:8px;bottom:8px;height:62vh;width:auto;border-radius:24px;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  body.panel-open #panel{transform:none}
  body.panel-off #panel{display:flex}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:rgba(125,138,156,.4);margin:8px auto 0;flex:none}
  .hide-m{display:none!important}
  .brand small{display:none}
  .tbtn{padding:0 11px}
}
@media(max-width:520px){ .brand b{display:none} #top{gap:6px;padding:0 8px} .tbtn .t{display:none} }
/* ---------- markers ---------- */
.cm-icon{background:none;border:0}
.cm{position:relative;width:28px;height:28px}
.cm .pin{position:absolute;left:1px;top:0;width:26px;height:26px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#6d93c2,#4f78a8);transform:rotate(-45deg);border:2.5px solid rgba(255,255,255,.95);box-shadow:0 4px 10px rgba(46,70,105,.3)}
.cm .pin::after{content:'';position:absolute;width:8px;height:8px;background:#f3dca4;border-radius:50%;left:6.5px;top:6.5px}
.cm .lbl{position:absolute;left:32px;top:-8px;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);border:1px solid rgba(255,255,255,.8);border-radius:12px;padding:5px 10px;box-shadow:0 6px 18px rgba(46,70,105,.16);white-space:nowrap;font-size:12px;line-height:1.45;font-family:'Noto Sans TC',sans-serif;color:var(--txt)}
.cm .lbl b{font-size:13px;color:var(--pri2);font-weight:900}
.cm .lbl .pr{color:var(--accD);font-weight:900}
.cm .lbl .ly{color:var(--mut)}
.cm.hl .pin{background:linear-gradient(135deg,#efc98c,#e0a06e)}
.cm.hl .lbl{background:rgba(255,248,232,.8);box-shadow:0 0 0 2px rgba(230,194,122,.7),0 6px 18px rgba(46,70,105,.16)}
.cm.dim{opacity:.32;filter:grayscale(.4)}
body.nolabel .cm .lbl{display:none}
.cm.tmp .pin{background:linear-gradient(135deg,#e7a29c,#d47f79);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:rotate(-45deg) translate(3px,-3px)}}
.leaflet-popup-content-wrapper{background:var(--glass3)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:16px!important;box-shadow:var(--sh)!important}
.leaflet-popup-tip{background:rgba(255,255,255,.86)!important}
.leaflet-popup-content{margin:12px 14px;font-family:'Noto Sans TC',sans-serif}
.pp{min-width:200px}
.pp .addr{font-size:13px;color:var(--mut);margin-bottom:10px;line-height:1.5}
.pp .row{display:flex;gap:6px}
/* ---------- generic ---------- */
.btn{border:1px solid rgba(120,140,170,.22);background:rgba(255,255,255,.7);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--txt)}
.btn:hover{background:rgba(255,255,255,.95);border-color:rgba(120,140,170,.35)}
.btn.pri{background:linear-gradient(135deg,#6890c0,#4f78a8);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,120,168,.28)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.gold{background:linear-gradient(135deg,#f2d89d,#e6c27a);border-color:transparent;color:#5e4613;box-shadow:0 4px 12px rgba(214,170,90,.25)}
.btn.ok{background:linear-gradient(135deg,#86bea0,#6faa8b);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(111,170,139,.28)}
.btn.ghost{background:none;border-color:transparent;color:var(--pri);box-shadow:none}
.btn.ghost:hover{background:var(--priL)}
.btn.danger{color:var(--rose);border-color:rgba(212,127,121,.3);background:rgba(255,255,255,.55)}
.btn.ghost.del{color:var(--rose)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.empty{color:var(--mut);text-align:center;padding:22px 10px;font-size:14px;border:1.5px dashed rgba(125,138,156,.3);border-radius:16px;margin:6px 0;background:rgba(255,255,255,.35)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(120,140,170,.22);background:rgba(255,255,255,.65);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;margin:0 6px 6px 0;color:var(--txt)}
.chip:hover{background:rgba(255,255,255,.95)}
.chip.on{background:linear-gradient(135deg,#6890c0,#4f78a8);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(79,120,168,.25)}
.chip.sug{border-style:dashed;color:var(--pri);background:var(--priL)}
.chip .x{border:0;background:none;padding:0 0 0 2px;font-size:15px;line-height:1;color:inherit;opacity:.75}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--mut)}
.fld.req>span::after{content:' *';color:var(--rose)}
input,select,textarea{border:1px solid rgba(120,140,170,.25);border-radius:11px;padding:9px 11px;background:rgba(255,255,255,.72);width:100%;min-width:0;font-size:15px;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus,textarea:focus{border-color:rgba(79,120,168,.55);background:#fff;box-shadow:0 0 0 4px var(--priL)}
input[readonly]{background:rgba(79,120,168,.08);color:var(--pri2);font-weight:700;border-color:transparent}
textarea{min-height:64px;resize:vertical}
.g2,.g3,.g4{display:grid;gap:0 12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.g2{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}}
/* ---------- panel content ---------- */
.citem{border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(46,70,105,.05);transition:background .18s,box-shadow .18s,transform .18s}
.citem:hover{background:rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(46,70,105,.1);transform:translateY(-1px)}
.citem .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.citem .t b{font-size:15px;color:var(--pri2)}
.citem .pr{color:var(--accD);font-weight:900;white-space:nowrap}
.citem .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.stat{background:linear-gradient(135deg,rgba(104,144,192,.16),rgba(230,194,122,.18));border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:14px;margin:10px 0}
.stat .big{font-size:28px;font-weight:900;color:var(--pri2)}
.stat .big small{font-size:14px;font-weight:700}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 12px}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.rtable th{color:var(--mut);font-size:12px;font-weight:700}
.rtable td.n,.rtable th.n{text-align:right}
.sechd{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
.sechd h4{margin:0;font-size:14px}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(60,80,110,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.card{background:rgba(250,251,253,.74);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.75);border-radius:26px;width:100%;max-width:900px;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(46,70,105,.25);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}}
.card.narrow{max-width:560px}
.chd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;color:var(--pri2);flex:none}
.chd h3{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}
.chd .close{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.6);color:var(--mut);width:36px;height:36px;border-radius:50%;font-size:16px}
.chd .close:hover{background:#fff;color:var(--txt)}
.mtabs{display:flex;gap:4px;padding:4px 14px 10px;overflow-x:auto;flex:none;scrollbar-width:none;border-bottom:1px solid var(--line)}
.mtabs button{border:0;background:none;padding:8px 13px;font-weight:700;color:var(--mut);border-radius:12px;white-space:nowrap;font-size:14px}
.mtabs button:hover{background:rgba(255,255,255,.5)}
.mtabs button.on{color:var(--pri2);background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(46,70,105,.08)}
.mtabs .cnt{display:inline-block;background:var(--accL);color:var(--accD);border-radius:9px;padding:0 6px;font-size:11.5px;margin-left:4px}
.cbody{flex:1;overflow:auto;padding:16px 20px}
.cft{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex:none;align-items:center;background:rgba(255,255,255,.35)}
@media(max-width:600px){.ov{padding:0}.card{max-height:100vh;height:100%;border-radius:0}}
.hint{background:rgba(230,194,122,.16);border:1px solid rgba(230,194,122,.35);color:#86672a;border-radius:12px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.sub{font-size:13px;font-weight:900;color:var(--pri2);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sub::before{content:'';width:4px;height:15px;background:var(--acc);border-radius:2px}
/* plans */
.upload{display:flex;align-items:center;justify-content:center;border:2px dashed rgba(79,120,168,.3);border-radius:18px;padding:22px;color:var(--pri);font-weight:700;cursor:pointer;background:rgba(255,255,255,.45);margin-bottom:14px;transition:background .18s}
.upload:hover{background:rgba(255,255,255,.75)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.plan{border:1px solid rgba(255,255,255,.8);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(46,70,105,.06)}
.plan img{width:100%;height:150px;object-fit:contain;background:rgba(240,243,247,.8);display:block;cursor:zoom-in}
.plan{position:relative}
.plan .pdel{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(46,70,105,.15)}
.plans{margin-bottom:6px}
/* view mode */
.chd .btn.sm{padding:7px 13px;font-size:13.5px}
.vplans{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.vplans img{width:100%;height:220px;object-fit:contain;background:#fff;border-radius:16px;border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(46,70,105,.1);cursor:zoom-in;display:block}
.vplans.one{grid-template-columns:1fr}
.vplans.one img{height:auto;max-height:380px}
.vinfo{display:grid;gap:6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.vinfo>div{display:flex;gap:10px;align-items:flex-start}
.vinfo>div>span{color:var(--mut);font-size:12.5px;font-weight:700;min-width:30px;padding-top:1px}
.rtag{font-style:normal;display:inline-block;background:var(--priL);color:var(--pri2);border-radius:10px;padding:1px 9px;font-size:12.5px;margin:0 5px 4px 0;font-weight:700}
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:760px){.kgrid{grid-template-columns:repeat(3,1fr)}}
.kpi{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:10px 12px;box-shadow:0 2px 8px rgba(46,70,105,.05);min-width:0}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.kpi b{display:block;font-size:22px;font-weight:900;color:var(--pri2);line-height:1.25}
.kpi i{font-style:normal;font-size:11.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.gold{background:linear-gradient(140deg,rgba(243,220,164,.45),rgba(255,255,255,.6))}
.kpi.gold b{color:var(--accD)}
.kpi.sage{background:linear-gradient(140deg,rgba(111,170,139,.22),rgba(255,255,255,.6))}
.kpi.sage b{color:#4f8a6b}
.vnote{background:rgba(255,255,255,.5);border-radius:14px;padding:10px 13px;margin-top:12px;font-size:13.5px;white-space:pre-wrap}
.wwrap{overflow-x:auto;margin-bottom:6px}
.wtab{width:100%;border-collapse:separate;border-spacing:4px;min-width:340px}
.wtab th{font-size:11.5px;color:var(--mut);font-weight:700;text-align:center;line-height:1.3}
.wtab th.td{color:#c27a45}
.wtab td.nm{font-size:13px;white-space:nowrap;padding-right:4px;line-height:1.3}
.wtab td.nm span{display:block;font-size:11px;color:var(--mut)}
.wtab td.d{text-align:center;border-radius:10px;font-size:12.5px;font-weight:900;padding:8px 0;background:rgba(255,255,255,.55)}
.wtab td.w{background:linear-gradient(160deg,#7397c4,#5a80b0);color:#fff}
.wtab td.o{background:rgba(243,220,164,.5);color:#8a6a2a}
.wtab td.today{box-shadow:0 0 0 2px #e0a06e}
/* layouts */
.lrow{display:grid;grid-template-columns:1.7fr .8fr .8fr .8fr 1fr 34px;gap:6px;margin-bottom:6px;align-items:center}
.lrow.h{font-size:12px;color:var(--mut);font-weight:700}
.lrow input{padding:8px 7px}

<script>
/* ================= 基本工具 ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=Number(v);return isFinite(n)?n:null};
const f1=n=>n==null||!isFinite(n)?'—':(Math.round(n*10)/10).toLocaleString('zh-TW',{maximumFractionDigits:1});
const f2=n=>n==null||!isFinite(n)?'—':(Math.round(n*100)/100).toLocaleString('zh-TW',{maximumFractionDigits:2});
const fInt=n=>n==null||!isFinite(n)?'—':Math.round(n).toLocaleString('zh-TW');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((Date.UTC(...b.split('-').map((v,i)=>i==1?v-1:+v))-Date.UTC(...a.split('-').map((v,i)=>i==1?v-1:+v)))/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
const todayStr=()=>ymd(new Date());
const clone=o=>JSON.parse(JSON.stringify(o));
const WD=['一','二','三','四','五','六','日'];
const WDS=['日','一','二','三','四','五','六'];
const TITLES=['督導','總幹事','主任','組長','管理員','保全'];
const STAGES=[{k:'recruit',n:'募集線',c:'#e0a06e'},{k:'track',n:'追蹤線',c:'#5a80b0'},{k:'entrust',n:'已委託',c:'#6faa8b'}];
const stg=k=>STAGES.find(s=>s.k===k)||STAGES[0];
function toast(msg,ms=2400){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)}

/* ================= 儲存（IndexedDB，失敗則 localStorage） ================= */
const KV={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('sqjg-farming',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db){try{res(JSON.parse(localStorage.getItem(k)))}catch(e){res(null)}return}
    try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  set(k,v){return new Promise(res=>{if(!this.db){try{localStorage.setItem(k,JSON.stringify(v));res(true)}catch(e){res(false)}return}
    try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};
const DEFAULT_STATE=()=>({version:1,communities:[],shiftPatterns:[{id:'p42',name:'做四休二',work:4,off:2}],settings:{brand:'日勝房屋 業務區長 吳松儒Ryan 0975-711-267'},view:null});
let S=DEFAULT_STATE();
let saveT=null,CURKEY='state';
function saveLocal(){clearTimeout(saveT);const key=CURKEY;saveT=setTimeout(async()=>{const ok=await KV.set(key,S);if(!ok)toast('⚠️ 本機儲存失敗（瀏覽器空間不足？）',4000)},250)}
function persist(){saveLocal();scheduleSync()}

/* ================= 資料計算 ================= */
function cAge(c){let y=c.builtYear;if(!y)return null;if(y<1911)y+=1911;return new Date().getFullYear()-y}
function adYear(y){if(!y)return null;return y<1911?y+1911:y}
function roomsList(c){const s=new Set();(c.layouts||[]).forEach(l=>{if(l.rooms!=null)s.add(+l.rooms)});if(!s.size)(c.listings||[]).forEach(l=>{if(l.rooms!=null)s.add(+l.rooms)});return [...s].sort((a,b)=>a-b)}
function roomsStr(c){const r=roomsList(c);return r.length?r.map(x=>x+'房').join('·'):''}
function unitPrice(l){return l.price>0&&l.ping>0?l.price/l.ping:null}
function listAvg(c){return mean((c.listings||[]).map(unitPrice).filter(v=>v>0))}
function layoutStr(o){if(o.rooms==null&&o.halls==null&&o.baths==null)return '—';return `${o.rooms??'-'}房${o.halls??'-'}廳${o.baths??'-'}衛`}
function parkStr(l){if(!l.parkCount)return '無';return `${l.parkAccess||''}${l.parkType||''}×${l.parkCount}`}
function floorsStr(c){const a=c.floorsAbove,b=c.floorsBelow;if(a==null&&b==null)return '—';return `地上${a??'-'}F / 地下${b??0}F`}
function personName(s){const full=(s.surname||'')+(s.given||'');if(s.given)return full;return (s.surname||'')+(s.gender==='女'?'小姐':'先生')}
function pattern(id){return S.shiftPatterns.find(p=>p.id===id)||S.shiftPatterns[0]}
function isWork(st,ds){if(!st.anchor)return null;const p=pattern(st.shiftId);if(!p)return null;const cyc=p.work+p.off;const d=dayDiff(st.anchor,ds);const i=((d%cyc)+cyc)%cyc;return i<p.work}
function allRoads(){const s=new Set();S.communities.forEach(c=>(c.roads||[]).forEach(r=>r&&s.add(r)));return [...s].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function roadStats(road){const cs=S.communities.filter(c=>(c.roads||[]).includes(road));const pr=cs.filter(c=>c.avgPrice>0);return {road,cs,priced:pr,avg:mean(pr.map(c=>+c.avgPrice))}}
function combinedStats(roads){const cs=S.communities.filter(c=>(c.roads||[]).some(r=>roads.includes(r)));const pr=cs.filter(c=>c.avgPrice>0);return {cs,priced:pr,avg:mean(pr.map(c=>+c.avgPrice))}}
function stageCount(c,k){return (c.listings||[]).filter(l=>l.stage===k).length}
function diffTag(up,avg){if(!(up>0)||!(avg>0))return '';const d=(up/avg-1)*100;return `<span class="diff ${d>=0?'u':'d'}">${d>=0?'+':''}${f1(d)}%</span>`}

/* ================= 地圖 ================= */
let map,layer,tempMarker=null,tempGeo=null,geoSeq=0,RS=new Set(),PT='list',relocating=null;
function initMap(){
  map=L.map('map',{zoomControl:false}).setView([22.6805,120.3005],15);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  if(S.view)map.setView([S.view.lat,S.view.lng],S.view.z);
  else if(S.communities.length)fitAll();
  map.on('click',e=>{if(relocating)return;placeTemp(e.latlng)});
  map.on('moveend',()=>{const c=map.getCenter();S.view={lat:c.lat,lng:c.lng,z:map.getZoom()};persist()});
  map.on('zoomend',applyLabelZoom);applyLabelZoom();
}
function applyLabelZoom(){document.body.classList.toggle('nolabel',S.settings.hideLabels||map.getZoom()<14)}
function fitAll(){const pts=S.communities.map(c=>[c.lat,c.lng]);if(!pts.length)return;if(pts.length===1)map.setView(pts[0],17);else map.fitBounds(pts,{paddingTopLeft:[60,100],paddingBottomRight:[isMobile()?60:440,60],maxZoom:17})}
function markerHtml(c,cls=''){
  const n=(c.listings||[]).length;const rs=roomsStr(c);
  return `<div class="cm ${cls}"><div class="pin"></div><div class="lbl"><b>${esc(c.name||'未命名社區')}</b><br><span class="pr">均 ${c.avgPrice>0?f1(+c.avgPrice)+' 萬/坪':'—'}</span>　在售 <b style="font-size:12px">${n}</b>${rs?`<br><span class="ly">${rs}</span>`:''}</div></div>`;

function renderMarkers(){
  layer.clearLayers();

  S.communities.forEach(c=>{
    const cls=hl?(hl.has(c.id)?'hl':'dim'):'';
    const m=L.marker([c.lat,c.lng],{icon:L.divIcon({className:'cm-icon',html:markerHtml(c,cls),iconSize:[28,28],iconAnchor:[14,32]}),zIndexOffset:cls==='hl'?500:0,riseOnHover:true});
    m.on('click',()=>openCommunity(c.id));
    m.addTo(layer);

}
function tempIcon(){return L.divIcon({className:'cm-icon',html:'<div class="cm tmp"><div class="pin"></div></div>',iconSize:[28,28],iconAnchor:[14,32]})}
function placeTemp(latlng){
  cancelTemp();
  tempMarker=L.marker(latlng,{icon:tempIcon(),draggable:true,zIndexOffset:1000}).addTo(map);
  tempMarker.bindPopup(popupHtml(),{closeButton:false,offset:[0,-26],autoPan:true}).openPopup();
  tempMarker.on('dragend',()=>{doRevGeo();tempMarker.openPopup()});
  doRevGeo();
}
function popupHtml(){return `<div class="pp"><div class="addr" id="ppAddr">${tempGeo?esc(tempGeo.display||'（查無地址，可手動輸入）'):'查詢地址中…'}</div><div class="row"><button class="btn pri" onclick="openNew()">＋ 新增</button><button class="btn" onclick="cancelTemp()">取消</button></div><div class="small mut" style="margin-top:6px">可拖曳紅色圖標微調位置</div></div>`}
function cancelTemp(){if(tempMarker){map.removeLayer(tempMarker);tempMarker=null}tempGeo=null;geoSeq++}
async function doRevGeo(){
  tempGeo=null;const my=++geoSeq;const ll=tempMarker.getLatLng();
  const el=$('#ppAddr');if(el)el.textContent='查詢地址中…';
  const g=await revGeo(ll.lat,ll.lng);if(my!==geoSeq)return;
  tempGeo=g||{display:'',road:''};
  const e2=$('#ppAddr');if(e2)e2.textContent=tempGeo.display||'（查無地址，可手動輸入）';
  if(E&&E._pendingGeo===my){applyGeoToDraft(tempGeo)}
}
async function revGeo(lat,lng){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=zh-TW`);
    const j=await r.json();const a=j.address||{};
    const road=a.road||a.pedestrian||'';
    const display=[a.city||a.county||'',a.suburb||a.city_district||a.town||'',road,a.house_number?(String(a.house_number).replace(/號$/,'')+'號'):''].join('');
    return {road,display:display||j.display_name||''};
  }catch(e){return null}
}

let qT=null;
$('#q').addEventListener('input',e=>{clearTimeout(qT);const v=e.target.value.trim();if(!v){$('#qres').style.display='none';return}qT=setTimeout(()=>doSearch(v),450)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(qT);doSearch(e.target.value.trim())}});
document.addEventListener('click',e=>{if(!e.target.closest('#searchWrap'))$('#qres').style.display='none';if(!e.target.closest('.menu'))$('#drop').classList.remove('on')});
async function doSearch(v){
  if(!v)return;const box=$('#qres');
  const local=S.communities.filter(c=>(c.name||'').includes(v)||(c.address||'').includes(v)||(c.roads||[]).some(r=>r.includes(v))||(c.builder||'').includes(v));
  let html=local.length?`<div class="h">已建社區</div>`+local.map(c=>`<div data-cid="${c.id}">🏢 ${esc(c.name)} <span class="mut small">${esc((c.roads||[]).join('、'))}</span></div>`).join(''):'';
  box.innerHTML=html+`<div class="h">地圖搜尋中…</div>`;box.style.display='block';
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(v)}&countrycodes=tw&limit=6&accept-language=zh-TW&viewbox=120.20,22.80,120.42,22.55`);
    const j=await r.json();
    html+=`<div class="h">地圖地點</div>`+(j.length?j.map(p=>`<div data-lat="${p.lat}" data-lng="${p.lon}">📍 ${esc(p.display_name.split(',').slice(0,3).join('，'))}</div>`).join(''):`<div class="h">查無地點</div>`);
  }catch(e){html+=`<div class="h">地圖搜尋暫時無法使用</div>`}
  box.innerHTML=html;
}
$('#qres').addEventListener('click',e=>{const d=e.target.closest('div[data-cid],div[data-lat]');if(!d)return;$('#qres').style.display='none';

function openCommunity(id,focus){

function strip(o){const r={};for(const k in o)if(!k.startsWith('_'))r[k]=o[k];return r}
const dirty=()=>!!E&&JSON.stringify(strip(E))!==EORIG;
function closeModal(force){

async function addPlans(files){

  rerenderBody();toast(`已加入 ${files.length} 張平面圖`);

function compressImg(file,max=1800){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.86))};img.src=fr.result};fr.readAsDataURL(file)})}

function buildReport(){
  const P=PDF;let cs=[],title='',sub='',secs='';const date=todayStr().replace(/-/g,'/');
  if(P.mode==='community'){cs=S.communities.filter(c=>P.cids.has(c.id));if(!cs.length){toast('請至少勾選一個社區');return null}
    title=cs.length===1?cs[0].name:`${cs[0].name} 等 ${cs.length} 個社區`;sub='社區精耕資料';}
  else if(P.mode==='road'){const roads=[...P.roads].filter(r=>allRoads().includes(r));if(!roads.length){toast('請至少勾選一條道路');return null}
    cs=combinedStats(roads).cs;title=roads.join('、');sub='道路成交均價與社區資料';
    secs+=rptRoads(roads);}
  else{cs=S.communities.slice();title='全部社區';sub=`商圈內 ${cs.length} 個社區總覽`;secs+=rptOverview(cs);}
  cs=cs.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant'));
  if(P.mode!=='road'||P.detail)secs+=cs.map(c=>rptCommunity(c,P)).join('');
  const cover=P.cover?rptCover(title,sub,cs):'';
  const fname=`商圈精耕_${P.mode==='all'?'全部社區':title.slice(0,30)}_${todayStr()}`.replace(/[\\/:*?"<>|]/g,'');
  return {html:cover+secs,fname,date};
}

function rptCommunity(c,P){

async function makePDF(r){
  if(!window.html2canvas||!window.jspdf){toast('PDF 元件載入失敗，請確認網路後重新整理，或改用「列印版」',4000);return}
  const host=$('#rpt');host.innerHTML=r.html;const pg=$('#prog');pg.classList.add('on');$('#progB').style.width='0';$('#progT').textContent='產生 PDF 中…';
  try{
    await waitImgs(host);if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    const MM=190/760,TOP=11,X=10,PH=Math.floor(270/MM);
    const pages=[];const secs=[...host.querySelectorAll('.rpt-sec')];
    for(let si=0;si<secs.length;si++){
      const sec=secs[si];$('#progT').textContent=`產生 PDF 中…（${si+1}/${secs.length}）`;$('#progB').style.width=Math.round(si/secs.length*100)+'%';
      await new Promise(r=>setTimeout(r,20));
      const canvas=await html2canvas(sec,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const sr=sec.getBoundingClientRect();const H=sr.height;const sc=canvas.width/sr.width;
      const cands=[...sec.querySelectorAll('.pb,tbody tr,h3')].map(el=>{const b=el.getBoundingClientRect();return el.tagName==='H3'?b.top-sr.top-4:b.bottom-sr.top+1}).filter(y=>y>0&&y<H).sort((a,b)=>a-b);
      let start=0;
      while(start<H-2){let end=start+PH;if(end>=H)end=H;else{const ok=cands.filter(y=>y>start+PH*.35&&y<=end);if(ok.length)end=ok[ok.length-1]}
        const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=Math.max(1,Math.round((end-start)*sc));const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,pc.height);
        cx.drawImage(canvas,0,Math.round(start*sc),pc.width,pc.height,0,0,pc.width,pc.height);
        pages.push({img:pc.toDataURL('image/jpeg',.9),h:(end-start)*MM,cover:sec.classList.contains('cover')});start=end}
    }
    pages.forEach((p,i)=>{if(i)pdf.addPage();pdf.addImage(p.img,'JPEG',X,TOP,190,p.h);if(!p.cover)pdf.addImage(footerImg(i+1,pages.length),'PNG',X,285,190,6)});
    $('#progB').style.width='100%';
    pdf.save(r.fname+'.pdf');toast(`PDF 已產生（${pages.length} 頁）`);
  }catch(err){console.error(err);toast('PDF 產生失敗：'+(err.message||err),4000)}
  finally{pg.classList.remove('on');host.innerHTML=''}
}

function fromCloud(d,loc){const c={...d};c.plans=(d.plans||[]).map(p=>({id:p.id,caption:p.caption||'',src:CLOUD.planCache[p.id]||(loc&&(loc.plans||[]).find(x=>x.id===p.id)||{}).src||''}));['roads','layouts','staff','listings'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});return c}

async function syncUp(){

    for(const id of Object.keys(CLOUD.last))if(!ids.has(id)){delete CLOUD.last[id];wr(fs.deleteDoc(fs.doc(db,'sqfarm',uid,'communities',id)))}

      for(const pid of [...CLOUD.planSent])if(!live.has(pid)){CLOUD.planSent.delete(pid);delete CLOUD.planCache[pid];wr(fs.deleteDoc(fs.doc(db,'sqfarm',uid,'plans',pid)))}}

function afterRemote(){saveLocal();renderAll();setCloudUI()}
function onCloudErr(e){console.error(e);CLOUD.err=e;setCloudUI();if(e&&e.code==='permission-denied')toast('⚠️ 雲端讀取被拒：請到 Firebase 加入本系統的 Firestore 規則',5000)}
function onComm(snap){
  if(snap.metadata.fromCache&&!CLOUD.commReady)return;
  if(!CLOUD.commReady){
    const cloud=new Map(snap.docs.map(d=>[d.id,d.data()]));const known=new Set(S.cloudIds||[]);const out=[];let dropped=0;
    for(const [id,d] of cloud){const loc=S.communities.find(c=>c.id===id);if(loc&&(loc.updatedAt||0)>(d.updatedAt||0))out.push(loc);else{const c=fromCloud(d,loc);out.push(c);CLOUD.last[id]=JSON.stringify(commDocData(c))}}
    for(const loc of S.communities)if(!cloud.has(loc.id)){if(known.has(loc.id))dropped++;else out.push(loc)}
    S.communities=out;S.cloudIds=snap.docs.map(d=>d.id);CLOUD.commReady=true;CLOUD.err=null;afterRemote();syncUp();
    if(!S.view&&S.communities.length)fitAll();
    return;
  }
  let ch=false;
  snap.docChanges().forEach(x=>{if(x.doc.metadata.hasPendingWrites)return;const id=x.doc.id;
    if(x.type==='removed'){if(S.communities.some(c=>c.id===id)){S.communities=S.communities.filter(c=>c.id!==id);ch=true}delete CLOUD.last[id];return}
    const d=x.doc.data();const i=S.communities.findIndex(c=>c.id===id);const loc=S.communities[i];

    if(loc&&JSON.stringify(commDocData(loc))===j){CLOUD.last[id]=j;return}

function applyPlan(id,src){let ch=false;for(const c of S.communities){const p=(c.plans||[]).find(p=>p.id===id);if(p&&p.src!==src){p.src=src;ch=true}}return ch}

  snap.docChanges().forEach(x=>{const id=x.doc.id;if(x.type==='removed'){delete CLOUD.planCache[id];CLOUD.planSent.delete(id);return}
    const v=x.doc.data();CLOUD.planCache[id]=v.src;CLOUD.planSent.add(id);if(applyPlan(id,v.src))ch=true});

}

function stopCloud(){CLOUD.unsubs.forEach(u=>{try{u()}catch(e){}});CLOUD.unsubs=[];CLOUD.commReady=CLOUD.plansReady=CLOUD.metaReady=false;CLOUD.last={};CLOUD.planSent=new Set();CLOUD.planCache={};CLOUD.meta='';CLOUD.err=null}

    if(!confirm(unsynced?'還有資料尚未上傳到雲端，登出後這些變更可能遺失。確定登出？':'登出後這台裝置將不再顯示你的雲端資料（資料仍保存在雲端）。確定登出？'))return;
    const uid=CLOUD.user.uid;await FB.signOut();if(!unsynced)await KV.set('state:'+uid,null);$('#ov2').classList.remove('on');toast('已登出')}
});
